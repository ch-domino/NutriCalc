<!doctype html>
<html lang="sk">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>NutriCalc</title>
		<meta name="description" />
		<link rel="icon" type="image/svg+xml" href="icon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="grain" aria-hidden="true"></div>

		<header class="site-head">
			<div class="site-head__inner">
				<a class="brand" href="#/" aria-label="NutriCalc — domov">
					<img
						class="brand__icon"
						src="icon.svg"
						alt=""
						width="28"
						height="28"
					/>
					<span class="brand__name">NutriCalc</span>
				</a>
				<div class="account" id="account-area">
					<button
						id="account-signed-out-btn"
						class="account__btn"
						type="button"
						hidden
					>
						Prihlásiť sa
					</button>
					<div id="account-signed-in" class="account__signed-in" hidden>
						<button
							id="account-menu-btn"
							class="account__btn account__btn--user"
							type="button"
							aria-haspopup="true"
							aria-expanded="false"
						>
							<span id="account-username"></span>
						</button>
						<div id="account-menu" class="account__menu" hidden>
							<button id="open-settings-btn" type="button">
								Moje nastavenia
							</button>
							<button id="logout-btn" type="button">Odhlásiť sa</button>
						</div>
					</div>
				</div>
			</div>
		</header>

		<main id="main">
			<!-- LIST VIEW -->
			<section id="view-list" class="view">
				<div class="toolbar">
					<label class="search" for="search-input">
						<svg
							class="search__icon"
							viewBox="0 0 20 20"
							fill="none"
							aria-hidden="true"
						>
							<circle
								cx="8.5"
								cy="8.5"
								r="6"
								stroke="currentColor"
								stroke-width="1.6"
							/>
							<path
								d="M17 17l-4-4"
								stroke="currentColor"
								stroke-width="1.6"
								stroke-linecap="round"
							/>
						</svg>
						<input
							id="search-input"
							type="search"
							placeholder="Hľadať recept alebo surovinu…"
							autocomplete="off"
						/>
					</label>

					<div class="sort">
						<label for="sort-select">Zoradiť</label>
						<select id="sort-select">
							<option value="default">Podľa poradia</option>
							<option value="kcal-asc">Kalórie: od najnižších</option>
							<option value="kcal-desc">Kalórie: od najvyšších</option>
							<option value="time-asc">Čas prípravy: najkratší</option>
							<option value="protein-desc">Bielkoviny: najviac</option>
							<option value="title-asc">Názov: A–Z</option>
						</select>
					</div>
				</div>

				<div
					id="chip-row"
					class="chip-row"
					role="group"
					aria-label="Filter podľa typu jedla"
				></div>

				<label id="hide-restricted-row" class="checkbox-row" hidden>
					<input type="checkbox" id="hide-restricted" />
					<span>Skryť recepty s mojimi alergénmi</span>
				</label>

				<p id="result-count" class="result-count" aria-live="polite"></p>

				<div id="card-grid" class="card-grid"></div>

				<p id="empty-state" class="empty-state" hidden>
					Žiadny recept nezodpovedá hľadaniu. Skús iné slovo alebo zruš filtre.
				</p>
			</section>

			<!-- DETAIL VIEW -->
			<section id="view-detail" class="view" hidden>
				<button id="back-btn" class="back-btn" type="button">
					<svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
						<path
							d="M12 4l-6 6 6 6"
							stroke="currentColor"
							stroke-width="1.8"
							stroke-linecap="round"
							stroke-linejoin="round"
						/>
					</svg>
					Späť na recepty
				</button>

				<article id="detail-content"></article>
			</section>
		</main>

		<footer class="site-foot">
			<p>
				NutriCalc · dáta o výžive sú orientačné, prepočítané na jednu porciu.
			</p>
		</footer>

		<!-- AUTH DIALOG -->
		<dialog id="auth-dialog" class="dialog">
			<form method="dialog" class="dialog__form">
				<div class="dialog__tabs" role="tablist">
					<button
						type="button"
						class="dialog__tab"
						id="tab-login"
						aria-selected="true"
					>
						Prihlásenie
					</button>
					<button
						type="button"
						class="dialog__tab"
						id="tab-signup"
						aria-selected="false"
					>
						Registrácia
					</button>
				</div>

				<p id="auth-error" class="dialog__error" role="alert" hidden></p>

				<div id="auth-fields">
					<label class="field">
						<span>Používateľské meno</span>
						<input
							id="auth-username"
							type="text"
							autocomplete="username"
							required
							minlength="3"
							maxlength="24"
						/>
					</label>
					<label class="field">
						<span>Heslo</span>
						<input
							id="auth-passcode"
							type="password"
							autocomplete="current-password"
							required
							minlength="6"
						/>
					</label>
				</div>

				<div class="dialog__actions">
					<button type="button" id="auth-cancel-btn" class="btn btn--ghost">
						Zrušiť
					</button>
					<button type="submit" id="auth-submit-btn" class="btn btn--gold">
						Prihlásiť sa
					</button>
				</div>
			</form>
		</dialog>

		<!-- SETTINGS DIALOG -->
		<dialog id="settings-dialog" class="dialog">
			<form method="dialog" class="dialog__form">
				<h2 class="dialog__title">Moje nastavenia</h2>
				<p id="settings-error" class="dialog__error" role="alert" hidden></p>

				<label class="field">
					<span>Obmedzenia / alergény (oddeľ čiarkou)</span>
					<input
						id="settings-restrictions"
						type="text"
						placeholder="napr. laktóza, orechy, lepok"
					/>
				</label>

				<fieldset class="field-group">
					<legend>Denné ciele (voliteľné)</legend>
					<div class="field-grid">
						<label class="field field--compact">
							<span>Kalórie</span>
							<input
								id="target-kcal"
								type="number"
								min="0"
								placeholder="kcal"
							/>
						</label>
						<label class="field field--compact">
							<span>Bielkoviny</span>
							<input
								id="target-protein"
								type="number"
								min="0"
								placeholder="g"
							/>
						</label>
						<label class="field field--compact">
							<span>Sacharidy</span>
							<input id="target-carbs" type="number" min="0" placeholder="g" />
						</label>
						<label class="field field--compact">
							<span>Tuky</span>
							<input id="target-fat" type="number" min="0" placeholder="g" />
						</label>
					</div>
				</fieldset>

				<div class="dialog__actions">
					<button type="button" id="settings-cancel-btn" class="btn btn--ghost">
						Zrušiť
					</button>
					<button type="submit" id="settings-save-btn" class="btn btn--gold">
						Uložiť
					</button>
				</div>
			</form>
		</dialog>

		<script src="script.js"></script>
	</body>
</html>
